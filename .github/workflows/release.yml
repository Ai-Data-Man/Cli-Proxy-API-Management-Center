name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.10.3-adm'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all-in-one HTML
        run: |
          echo "VERSION=${{ steps.tag.outputs.version }}" && npm run build
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          sha256sum management.html | cut -d' ' -f1 > management.html.sha256
          echo "Asset: management.html ($(ls -lh management.html | awk '{print $5}'))"
          echo "Digest: $(cat management.html.sha256)"

      - name: Create/update tag for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f "${{ steps.tag.outputs.version }}" HEAD
          git push origin "${{ steps.tag.outputs.version }}" --force

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${{ steps.tag.outputs.version }}"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${current_tag}"
          else
            range="${current_tag}"
          fi

          {
            echo "## 变更内容"
            echo ""
            git log --pretty=format:"- %h %s" "${range}"
            echo ""
            echo ""
            echo "---"
            echo "SHA256: $(cat dist/management.html.sha256)"
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          files: |
            dist/management.html
            dist/management.html.sha256
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
